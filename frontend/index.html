<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merch Configurator — Someone Wondered</title>
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="header-left">
                <h1>✨ someone wondered</h1>
                <span class="tag">merch configurator</span>
            </div>
            <a href="./sim.html" class="nav-link">space sim</a>
        </header>

        <main>
            <div id="shirt-preview">
                <svg id="shirt-svg" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
                    <path id="shirt-path" d="
                        M 165,12
                        C 175,6  185,6  195,10
                        C 205,6  215,6  225,10
                        C 230,6  238,12 238,18
                        L 246,48
                        L 320,22
                        C 332,18 342,28 338,38
                        L 322,78
                        L 268,100
                        L 262,470
                        C 260,478 252,482 244,482
                        L 156,482
                        C 148,482 140,478 138,470
                        L 132,100
                        L 78,78
                        L 62,38
                        C 58,28 68,18 80,22
                        L 154,48
                        Z
                    " fill="#1a1a2e"/>
                </svg>
                <div id="shirt-text-overlay">ULM</div>
            </div>

            <div id="controls">
                <div class="card">
                    <div class="card-row">
                        <div class="field">
                            <label>Shirt color</label>
                            <input type="color" id="shirt-color" value="#1a1a2e">
                        </div>
                        <div class="field">
                            <label>Text color</label>
                            <input type="color" id="text-color" value="#ffffff">
                        </div>
                    </div>

                    <div class="card-row">
                        <div class="field">
                            <label>Custom text</label>
                            <input type="text" id="shirt-text" value="ULM" maxlength="20" placeholder="Your text here">
                        </div>
                    </div>

                    <div class="card-row">
                        <div class="field">
                            <label>Size</label>
                            <div class="sizes">
                                <button class="size-btn" data-size="S">S</button>
                                <button class="size-btn" data-size="M">M</button>
                                <button class="size-btn active" data-size="L">L</button>
                                <button class="size-btn" data-size="XL">XL</button>
                            </div>
                        </div>
                    </div>

                    <button id="add-to-cart">🛒 Add to Cart — $29.99</button>
                </div>
            </div>
        </main>

        <div id="toast" class="hidden"></div>
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
