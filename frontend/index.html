<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Merch Configurator — Someone Wondered</title>
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <div id="title-bar">
            <h1>✨ someone wondered</h1>
            <span id="tagline">merch configurator</span>
            <a href="./sim.html" class="nav-link">space sim</a>
        </div>

        <div id="configurator">
            <div id="preview">
                <canvas id="shirt-canvas" width="400" height="500"></canvas>
            </div>

            <div id="controls">
                <div class="control-row">
                    <div class="color-picker-group">
                        <label>Shirt</label>
                        <input type="color" id="shirt-color" value="#1a1a2e">
                    </div>
                    <div class="color-picker-group">
                        <label>Text</label>
                        <input type="color" id="text-color" value="#ffffff">
                    </div>
                </div>

                <div class="control-row">
                    <div class="text-input-group">
                        <label>Custom text</label>
                        <input type="text" id="shirt-text" value="ULM" maxlength="20" placeholder="Your text here">
                    </div>
                </div>

                <div class="control-row">
                    <div class="size-group">
                        <label>Size</label>
                        <div id="size-options">
                            <button class="size-btn" data-size="S">S</button>
                            <button class="size-btn" data-size="M">M</button>
                            <button class="size-btn active" data-size="L">L</button>
                            <button class="size-btn" data-size="XL">XL</button>
                        </div>
                    </div>
                </div>

                <div class="control-row">
                    <button id="add-to-cart">
                        <span class="btn-icon">🛒</span>
                        <span class="btn-text">Add to Cart — $29.99</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="toast" class="hidden"></div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
